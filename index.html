<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="header">
    <h1>Workout Tracker</h1>
    <p class="subtitle" id="sync-status">3-day split</p>
  </header>

  <section class="sync-panel" aria-label="Sync settings">
    <button type="button" class="sync-toggle" id="sync-toggle" aria-expanded="false">
      Sync across devices
      <span class="sync-chevron" aria-hidden="true">▼</span>
    </button>
    <div class="sync-body" id="sync-body" hidden>
      <p class="sync-hint">
        Use the same sync code on every phone or browser. Cloud sync needs a free Firebase setup (see README).
      </p>
      <label class="sync-label" for="sync-code">Sync code</label>
      <div class="sync-code-row">
        <input
          type="text"
          id="sync-code"
          class="sync-code-input"
          placeholder="e.g. my-workout-2024"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="generate-sync-code" class="btn-icon" title="Generate random code">🎲</button>
      </div>
      <p class="sync-message" id="sync-message" role="status"></p>
      <div class="sync-actions">
        <button type="button" id="pull-cloud" class="btn-secondary">Pull from cloud</button>
        <button type="button" id="export-weights" class="btn-secondary">Export</button>
        <button type="button" id="import-weights" class="btn-secondary">Import</button>
      </div>
    </div>
  </section>

  <nav class="day-tabs" role="tablist" aria-label="Workout days">
    <button type="button" class="day-tab active" data-day="0" role="tab" aria-selected="true">Push</button>
    <button type="button" class="day-tab" data-day="1" role="tab" aria-selected="false">Pull</button>
    <button type="button" class="day-tab" data-day="2" role="tab" aria-selected="false">Legs</button>
  </nav>

  <main id="workout-main" class="main"></main>

  <footer class="footer">
    <button type="button" id="clear-weights" class="btn-secondary">Clear all weights</button>
  </footer>

  <script src="sync-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
