<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="header">
    <h1>Workout Tracker</h1>
    <p class="subtitle" id="sync-status">Loading…</p>
  </header>

  <section class="sync-panel" aria-label="Sync settings">
    <button type="button" class="sync-toggle" id="sync-toggle" aria-expanded="false">
      Sync setup (one time)
      <span class="sync-chevron" aria-hidden="true">▼</span>
    </button>
    <div class="sync-body" id="sync-body" hidden>
      <p class="sync-hint">
        Paste a GitHub token once on each phone. Weights auto-save to your repo and load on every device — no export/import.
      </p>
      <label class="sync-label" for="github-token">GitHub token</label>
      <input
        type="password"
        id="github-token"
        class="sync-code-input"
        placeholder="ghp_… or github_pat_…"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="sync-hint">
        <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">Create a fine-grained token</a>
        → this repo only → Contents: Read and write.
      </p>
      <p class="sync-message" id="sync-message" role="status"></p>
      <div class="sync-actions">
        <button type="button" id="save-token" class="btn-secondary">Save token</button>
        <button type="button" id="pull-now" class="btn-secondary">Refresh now</button>
      </div>
    </div>
  </section>

  <nav class="day-tabs" role="tablist" aria-label="Workout days">
    <button type="button" class="day-tab active" data-day="0" role="tab" aria-selected="true">Push</button>
    <button type="button" class="day-tab" data-day="1" role="tab" aria-selected="false">Pull</button>
    <button type="button" class="day-tab" data-day="2" role="tab" aria-selected="false">Legs</button>
  </nav>

  <main id="workout-main" class="main"></main>

  <footer class="footer">
    <button type="button" id="clear-weights" class="btn-secondary">Clear all weights</button>
  </footer>

  <script src="sync-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
