<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="header">
    <h1>Workout Tracker</h1>
    <p class="subtitle">3-day split · weights saved on this device</p>
  </header>

  <nav class="day-tabs" role="tablist" aria-label="Workout days">
    <button type="button" class="day-tab active" data-day="0" role="tab" aria-selected="true">Push</button>
    <button type="button" class="day-tab" data-day="1" role="tab" aria-selected="false">Pull</button>
    <button type="button" class="day-tab" data-day="2" role="tab" aria-selected="false">Legs</button>
  </nav>

  <main id="workout-main" class="main"></main>

  <footer class="footer">
    <button type="button" id="clear-weights" class="btn-secondary">Clear all weights</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
